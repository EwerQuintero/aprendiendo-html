<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Ejercicio - Poema</title>
  </head>
  <body>
    <h1>Un poema de prueba</h1>

    <h2>Versión 1: solo con p</h2>
    <p>
      Roses are red
      Violets are blue
           Hollow Knight is great
      And so are you
    </p>

    <hr />

    <h2>Versión 2: con br</h2>
    <p>
      Roses are red<br />
      Violets are blue<br />
      Hollow Knight is great<br />
      And so are you
    </p>

    <hr />

    <h2>Versión 3: con pre</h2>
    <pre>
Roses are red
Violets are blue
     Hollow Knight is great
And so are you
    </pre
    >
  </body>
</html>
