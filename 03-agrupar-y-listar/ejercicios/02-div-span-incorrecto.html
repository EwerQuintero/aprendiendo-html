<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Ejercicio 1 - div y span (incorrecto)</title>
  </head>
  <body>
    <h1>Agrupando contenido</h1>

    <!-- div con span adentro y div sin cerrar -->
    <span>
      <h2>Caja uno</h2>
      <p>Soy un párrafo dentro de un span.</p>
    </span>

    <div>
      <h2>Caja dos</h2>
      <p>Soy un div que nunca se cierra.</p>

    <hr />

    <p>
      Mi jefe favorito es <div>Hornet</div> y mi zona favorita es
      <span>Sendero Verde</span>.
    </p>

    <hr />

    <!-- id repetido -->
    <p id="intro">Primer párrafo con id intro.</p>
    <p id="intro">Segundo párrafo con el MISMO id.</p>
  </body>
</html>
