<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Ejercicio 1 - div y span (correcto)</title>
  </head>
  <body>
    <h1>Agrupando contenido</h1>

    <!-- PARTE A: div agrupa bloques -->
    <div>
      <h2>Caja uno</h2>
      <p>Soy un párrafo dentro de un div.</p>
    </div>

    <div>
      <h2>Caja dos</h2>
      <p>Soy otro div, aparezco en una línea nueva.</p>
    </div>

    <hr />

    <!-- PARTE B: span marca un trozo dentro del texto -->
    <p>
      Mi jefe favorito es <span>Hornet</span> y mi zona favorita es
      <span>Sendero Verde</span>.
    </p>

    <hr />

    <!-- PARTE C: id es único, class se repite -->
    <p id="intro" class="destacado">Soy un párrafo con id y class.</p>
    <p class="destacado">Yo también tengo la class destacado.</p>
    <p class="destacado grande">Yo tengo dos clases.</p>
  </body>
</html>
