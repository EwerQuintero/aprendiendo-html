<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Ejercicio 2 - Listas y citas (incorrecto)</title>
  </head>
  <body>
    <h1>Listas y citas</h1>

    <!-- Lista dentro de un p -->
    <p>
      Mis personajes:
      <ul>
        <li>Hornet</li>
        <li>Zote</li>
      </ul>
    </p>

    <!-- Algo que no es li dentro de ul -->
    <ul>
      <p>Esto no es un li</p>
      <li>Quirrel</li>
    </ul>

    <!-- Lista anidada pegada al ul, no dentro del li -->
    <ul>
      <li>Zonas</li>
      <ul>
        <li>Sendero Verde</li>
      </ul>
      <li>Jefes</li>
    </ul>

    <!-- ol sin cerrar -->
    <ol>
      <li>Paso uno</li>
      <li>Paso dos</li>

    <hr />

    <!-- q con blockquote al revés -->
    <q><p>Una cita larga dentro de q.</p></q>
    <blockquote>Una cita corta, sola.</blockquote>

    <!-- abbr sin title -->
    <p><abbr>HTML</abbr> es un lenguaje de marcado.</p>
  </body>
</html>
