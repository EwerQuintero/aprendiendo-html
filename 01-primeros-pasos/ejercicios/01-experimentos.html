<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Experimentos - Módulo 01</title>
    </head>
    <body>
        <h1>Experimentos del módulo 01</h1>

        <!-- Experimento 1: h1 sin cerrar.
             Resultado: todo lo de abajo se volvía título (grande y en negrita). -->

        <!-- Experimento 2: saltos de línea.
             Varios saltos en el código se juntan en uno solo. Para un salto real se usa <br>. -->
        <p>Línea uno<br>Línea dos</p>

        <!-- Experimento 3: mayúsculas.
             <H1> funciona igual que <h1>, pero se escribe en minúscula por estándar. -->

        <!-- Experimento 4: sin meta charset.
             Las tildes se vieron bien por Live Server, pero hay que ponerlo siempre. -->
        <p>canción, año, niño, árbol</p>
    </body>
</html>
